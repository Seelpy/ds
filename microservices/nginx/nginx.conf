worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream valuator {
        server valuator:8082;
    }

    upstream rankcalculator {
        server rankcalculator:8082;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        server_name localhost;

        location ~ /rankcalculator {
            proxy_pass http://rankcalculator;
        }

        location ~ /valuator {
            proxy_pass http://valuator;
        }

        location /connection/websocket {
            proxy_pass http://centrifugo:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ / {
            proxy_pass http://valuator/valuator$request_uri;
        }
    }

    server {
        listen 8000;
        server_name localhost;

        location / {
            proxy_pass http://centrifugo:8000;
        }
    }
}